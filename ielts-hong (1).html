function up(c,cb){const d=c.toDataURL("image/jpeg",.65);if(!ASSETS){cb(d);return}c.toBlob(b=>{ASSETS.upload(b).then(r=>cb(r&&r.url?r.url:d),()=>cb(d))},"image/jpeg",.65)}
function d2b(u){const bin=atob(u.split(",")[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})}
async function migImgs(){if(!ASSETS)return;let ch=0;for(const o of [...S.notes,...S.slots,...Object.values(S.topics)]){if(!o.im)continue;for(let i=0;i<o.im.length;i++){const u=o.im[i];if(typeof u=="string"&&u.startsWith("data:")){try{const r=await ASSETS.upload(d2b(u));if(r&&r.url){o.im[i]=r.url;ch=1}}catch(e){}}}}if(ch){save();render()}}
async function push(f){if(!DB)return;if(!DIRTY&&!f)return;if(PUSH){AGAIN=1;return}PUSH=1;DIRTY=0;spset();
try{const s=JSON.stringify(clean()),n=Math.max(1,Math.ceil(s.length/60000));
for(let i=0;i<n;i++)await DB.doc(PA()+"c"+i).set({s:s.slice(i*60000,(i+1)*60000)});
await DB.doc(PA()+"m").set({ts:S.ts||Date.now(),n});
for(let i=n;i<RN;i++)await DB.doc(PA()+"c"+i).delete();
RN=n;SYNC="cloud";if(f)msg("Đã lưu lên tài khoản ✓")}catch(e){SYNC="err";DIRTY=1}
PUSH=0;spset();if(AGAIN){AGAIN=0;qpush()}}
async function pull(){const m=await DB.doc(PA()+"m").get();if(!m.exists)return null;const md=m.data();let s="";for(let i=0;i<md.n;i++){const c=await DB.doc(PA()+"c"+i).get();if(!c.exists)throw 0;s+=c.data().s}RN=md.n;return{ts:md.ts,state:JSON.parse(s)}}
function adopt(r){const keep={};["notes","slots","topics"].forEach(k=>keep[k]=S[k]);Object.assign(S,r.state);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
async function initSync(){try{const U=await claude.use("user"),D=await claude.use("db");ASSETS=await claude.use("assets");if(!U||!D){spset();return}UID=await U.id();if(!UID){spset();return}DB=D;
const r=await Promise.race([pull(),new Promise((_,j)=>setTimeout(j,10000))]);
if(r&&r.ts>(S.ts||0)){adopt(r);SYNC="cloud"}else{DIRTY=1;await push(true)}
spset();migImgs()}catch(e){SYNC=DB?"err":"local";spset()}}
document.addEventListener("visibilitychange",async()=>{if(!DB)return;if(document.hidden){push()}else{try{const m=await DB.doc(PA()+"m").get();if(m.exists&&m.data().ts>(S.ts||0)&&!PUSH){const r=await pull();if(r)adopt(r)}}catch(e){}}});
let qi=Math.floor(Date.now()/864e5)%Q.length;setInterval(()=>{const e=document.getElementById("hq");if(!e)return;e.style.opacity=0;setTimeout(()=>{qi=(qi+1)%Q.length;e.textContent="“"+Q[qi]+"”";e.style.opacity=1},500)},7000);
render();initSync();
</script>
